p{color:#cbd3ff;line-height:1.5;margin:10px 0;font-size:13px;font-family:system-ui,sans-serif}
.panel button{max-width:none;width:100%;margin-top:8px;font-size:15px;background:#17245a}
.row{display:flex;gap:8px}.row button{margin-top:8px}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0;font:600 12px Orbitron,system-ui;text-align:left}
